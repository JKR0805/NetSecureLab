[project]
name = "netsecurelab-backend"
version = "0.1.0"
description = "NetSecureLab - Integrated Network Security Assessment and Reconnaissance Framework"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.28.0,<1.0",
    "sqlalchemy>=2.0.0,<3.0",
    "pydantic>=2.0.0,<3.0",
    "pydantic-settings>=2.0.0,<3.0",
    "dnspython>=2.6.0,<3.0",
    "python-whois>=0.9.4,<1.0",
    "jinja2>=3.1.0,<4.0",
    "pyjwt>=2.8.0,<3.0",
    "bcrypt>=4.0.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0",
    "httpx>=0.27.0,<1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
